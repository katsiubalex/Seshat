<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 250" role="img" aria-label="Аэротенк и вторичный отстойник: возвратный и избыточный ил" font-family="Golos Text, system-ui, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs><text x="10" y="92" font-size="12" text-anchor="start" fill="currentColor">сточная</text><text x="10" y="107" font-size="12" text-anchor="start" fill="currentColor">вода Q</text><path d="M70 100 L120 100" fill="none" stroke="currentColor" stroke-width="1.6" marker-end="url(#ah)"/><rect x="120" y="60" width="190" height="80" rx="6" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-width="1.6"/><text x="215.0" y="97.0" font-size="13" text-anchor="middle" fill="currentColor" font-weight="600">Аэротенк</text><text x="215.0" y="113.0" font-size="11" text-anchor="middle" fill="currentColor" fill-opacity="0.75">иловая смесь, X ≈ 3–4 кг/м³</text><path d="M310 100 L370 100" fill="none" stroke="currentColor" stroke-width="1.6" marker-end="url(#ah)"/><text x="318" y="90" font-size="11" text-anchor="start" fill="currentColor">Q + Qᵣ</text><path d="M370 60 H560 V110 L465 160 L370 110 Z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M370 60 H560 V110 L465 160 L370 110 Z" fill="currentColor" fill-opacity=".08" stroke="none"/><text x="465" y="95" font-size="13" text-anchor="middle" fill="currentColor" font-weight="600">Вторичный</text><text x="465" y="111" font-size="13" text-anchor="middle" fill="currentColor" font-weight="600">отстойник</text><path d="M560 75 L630 75" fill="none" stroke="currentColor" stroke-width="1.6" marker-end="url(#ah)"/><text x="568" y="66" font-size="11" text-anchor="start" fill="currentColor">очищенная вода Q</text><path d="M465 160 L465 200 L215 200 L215 140" fill="none" stroke="currentColor" stroke-width="1.6" marker-end="url(#ah)"/><text x="340" y