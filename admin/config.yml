# Decap CMS — визуальный редактор статей Сешат без Git: правит те же Markdown-файлы в папке content/.
# Режим «editorial_workflow»: каждая правка становится предложением изменений (pull request) и попадает на проверку.
#
# Работа на своём компьютере (без входа на GitHub): в папке репозитория выполнить  npx decap-server
# и открыть http://localhost:8000/admin/ (сайт запустить любым локальным сервером на порту 8000).
# Работа на сайте: нужен OAuth-посредник для входа через GitHub (GitHub Pages его не даёт) — адрес указать в base_url.
backend:
  name: github
  repo: katsiubalex/Seshat
  branch: main
  # base_url: https://<ваш-oauth-посредник>   ← после настройки входа через GitHub
local_backend: true
publish_mode: editorial_workflow
locale: ru
site_url: https://katsiubalex.github.io/Seshat/
media_folder: assets/uploads
public_folder: /Seshat/assets/uploads
slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: processes
    label: "Физика и химия процессов"
    label_singular: "Процесс"
    folder: content/kb/processes
    create: true
    identifier_field: id
    slug: "{{id}}"
    summary: "{{title}}"
    fields:
      - { name: id, label: "Адрес статьи (латиница)", widget: string, pattern: ['^[a-z0-9-]+$', "Только латинские строчные буквы, цифры и дефис"] }
      - { name: title, label: "Название", widget: string }
      - { name: group, label: "Группа процессов", widget: string }
      - { name: order, label: "Порядок в списке", widget: number, required: false }
      - { name: body, label: "Текст: вводный абзац, разделы «## …», «## Уравнения», «## Ключевые числа», «## Источники»", widget: markdown }
  - name: indicators
    label: "Показатели качества воды"
    label_singular: "Показатель"
    folder: content/kb/indicators
    create: true
    identifier_field: id
    slug: "{{id}}"
    summary: "{{title}}"
    fields:
      - { name: id, label: "Адрес статьи (латиница)", widget: string, pattern: ['^[a-z0-9-]+$', "Только латинские строчные буквы, цифры и дефис"] }
      - { name: key, label: "Показатель в расчёте конструктора", widget: string, required: false }
      - { name: title, label: "Название", widget: string }
      - { name: unit, label: "Единицы", widget: string }
      - { name: typical, label: "Типичные значения в городских стоках", widget: string }
      - { name: order, label: "Порядок в списке", widget: number, required: false }
      - { name: body, label: "Разделы «## Что это», «## Почему важно», «## Как снижают», «## Источники»", widget: markdown }
  - name: aux
    label: "Вспомогательные здания"
    label_singular: "Здание"
    folder: content/kb/aux
    create: true
    identifier_field: id
    slug: "{{id}}"
    summary: "{{title}}"
    fields:
      - { name: id, label: "Адрес статьи (латиница)", widget: string }
      - { name: title, label: "Название", widget: string }
      - { name: proc, label: "Процессы (адреса статей)", widget: list, required: false }
      - { name: order, label: "Порядок в списке", widget: number, required: false }
      - { name: body, label: "Текст", widget: markdown }
  - name: fundamentals
    label: "Основы: дисциплины"
    label_singular: "Дисциплина"
    folder: content/kb/fundamentals
    create: true
    identifier_field: id
    slug: "{{id}}"
    summary: "{{title}}"
    fields:
      - { name: id, label: "Адрес статьи (латиница)", widget: string }
      - { name: title, label: "Название", widget: string }
      - { name: home, label: "Модуль «Основ»", widget: select, options: [fundamentals, basics] }
      - { name: mods, label: "Где пригодится (модули)", widget: list }
      - { name: order, label: "Порядок в списке", widget: number, required: false }
      - { name: body, label: "Текст: «## Ключевые формулы», разделы, «## Учебники» (Автор | Название | Издательство), «## Источники»", widget: markdown }
  - name: humanities
    label: "Человек и вода"
    label_singular: "Статья"
    folder: content/kb/humanities
    create: true
    identifier_field: id
    slug: "{{id}}"
    summary: "{{title}}"
    fields:
      - { name: id, label: "Адрес статьи (латиница)", widget: string }
      - { name: title, label: "Название", widget: string }
      - { name: order, label: "Порядок в списке", widget: number, required: false }
      - { name: body, label: "Текст: разделы, «## Почитать», «## Источники»", widget: markdown }
  - name: myths
    label: "Мифы о воде"
    label_singular: "Миф"
    folder: content/myths
    create: true
    identifier_field: id
    slug: "{{id}}"
    summary: "{{name}}"
    fields:
      - { name: id, label: "Адрес статьи (латиница)", widget: string }
      - { name: name, label: "Имя", widget: string }
      - { name: native, label: "Имя в оригинале", widget: string }
      - { name: epithet, label: "Кто это", widget: string }
      - { name: culture, label: "Культура", widget: string }
      - { name: about, label: "Подпись ссылки", widget: select, options: ["о боге", "о богине", "о легенде"] }
      - { name: legend, label: "Кратко (1–2 предложения)", widget: text }
      - name: mods
        label: "Созвучные модули"
        widget: list
        fields:
          - { name: module, label: "Модуль (id)", widget: string }
          - { name: why, label: "Чем созвучен", widget: string }
      - name: sources
        label: "Источники"
        widget: list
        fields:
          - { name: title, label: "Название", widget: string }
          - { name: url, label: "Ссылка", widget: string, required: false }
      - { name: order, label: "Порядок в списке", widget: number, required: false }
      - { name: body, label: "Вводный абзац и главы «## Тема: Заголовок»", widget: markdown }
