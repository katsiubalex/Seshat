<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" role="img" aria-label="Линия осадка и возвратный поток" font-family="Golos Text, system-ui, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs><rect x="10" y="40" width="170" height="50" rx="6" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-width="1.6"/><text x="95.0" y="62.0" font-size="12" text-anchor="middle" fill="currentColor" font-weight="600">Очистка воды</text><text x="95.0" y="78.0" font-size="11" text-anchor="middle" fill="currentColor" fill-opacity="0.75">отстойники, аэротенки</text><path d="M85 90 L85 140" fill="none" stroke="currentColor" stroke-width="1.6" marker-end="url(#ah)"/><text x="92" y="120" font-size="10.5" text-anchor="start" fill="currentColor">сырой осадок, избыточный ил</text><rect x="10" y="140" width="150" height="56" rx="6" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-width="1.6"/><text x="85.0" y="165.0" font-size="12" text-anchor="middle" fill="currentColor" font-weight="600">Уплотнение</text><text x="85.0" y="181.0" font-size="11" text-anchor="middle" fill="currentColor" fill-opacity="0.75">до 30–60 кг/м³</text><path d="M160 168 L210 168" fill="none" stroke="currentColor" stroke-width="1.6" marker-end="url(#ah)"/><rect x="210" y="140" width="150" height="56" rx="6" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-width="1.6"/><text x="285.0" y="165.0" font-size="12" text-anchor="middle" fill="currentColor" font-weight="600">Стабилизация</text><text x="285.0" y="181.0" font-size="11" text-anchor="middle" fill="currentColor" fill-opacity="0.75">метантенки / аэробная</text><path d="M360 168 L410 168" fill="none" stroke="currentColor" stroke-width="1.6" marker-end="url(#ah)"/><rect x="410" y="140" width="150" height="56" rx="6" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-width="1.6"/><text x="485.0" y="165.0" font-size="12" text-anchor="middle" fill="currentColor" font-weight="600">Обезвоживание</text><text x="485.0" y="181.0" font-size="11" text-anchor="middle" fill="currentColor" fill-opacity="0.75">влажность ≤ 82 %</text><path d="M560 168 L640 168" fill="none" stroke="currentColor" stroke-width="1.6" marker-end="url(#ah)"/><text x="600" y="160" font-size="11" text-anchor="middle" fill="currentColor">кек</text><path d="M85 196 V235" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M285 196 V235" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M485 196 V235" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M85 235 H690 V15 H130" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M130 15 L130 38" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/><text x="400" y="30" font-size="11" text-anchor="middle" fill="currentColor">фугат, сливная и иловая вода → в начало станции (СП 32 п. 9.1.7)</text><text x="400" y="252" font-size="10.5" text-anchor="middle" fill="currentColor" fill-opacity="0.8">возвратные потоки ≈ 1 % расхода, но до 10–15 % азота (IWA, разд. 5.12.1)</text></svg>
