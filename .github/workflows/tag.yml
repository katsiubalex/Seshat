# После слияния в main: если версия в package.json ещё не имеет тега — создать тег vX.Y.Z на этом коммите.
# Так каждая версия из CHANGELOG становится адресуемой точкой истории (AGENTS.md п. 22).
name: Тег версии
on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Поставить тег, если его ещё нет
        run: |
          v="v$(node -p "require('./package.json').version")"
          if git rev-parse -q --verify "refs/tags/$v" >/dev/null; then
            echo "Тег $v уже есть"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git tag -a "$v" -m "Версия ${v#v} — см. CHANGELOG.md"
          git push origin "$v"
          echo "Поставлен тег $v"
