# Пересборка статей: если на main поменялись файлы в content/, обновить js/content.js (его читает сайт)
name: Сборка статей
on:
  push:
    branches: [main]
    paths: ['content/**', 'js/mdcontent.js', 'tools/build-content.js']
  workflow_dispatch:
permissions:
  contents: write
  pages: write   # чтобы попросить GitHub Pages пересобрать сайт после коммита бота
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/build-content.js
      - name: Сохранить js/content.js, если изменился
        run: |
          if ! git diff --quiet js/content.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
            git add js/content.js
            git commit -m "Сборка статей из content/"
            git push
            # коммиты, сделанные ключом GITHUB_TOKEN, сами не запускают публикацию сайта — просим её явно
            gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Не удалось запросить сборку Pages: сайт обновится при следующем коммите"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
