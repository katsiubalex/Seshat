xt><text x="600.0" y="133.0" font-size="11" text-anchor="middle" fill="currentColor" fill-opacity="0.75">доочистки</text><path d="M10 120 L60 120" fill="none" stroke="currentColor" stroke-width="1.6" marker-end="url(#ah)"/><path d="M660 120 L695 120" fill="none" stroke="currentColor" stroke-width="1.6" marker-end="url(#ah)"/><path d="M40 35 L40 112" fill="none" stroke="currentColor" stroke-width="1.6" marker-end="url(#ah)"/><text x="40" y="28" font-size="11" text-anchor="middle" fill="currentColor" font-weight="600">Fe/Al</text><text x="40" y="180" font-size="11" text-anchor="middle" fill="currentColor">β = 2–3</text><path d="M330 35 L330 112" fill="none" stroke="currentColor" stroke-width="1.6" marker-end="url(#ah)"/><text x="330" y="28" font-size="11" text-anchor="middle" fill="currentColor" font-weight="600">Fe/Al</text><text x="330" y="180" font-size="11" text-anchor="middle" fill="currentColor">β = 1,5</text><path d="M510 35 L510 112" fill="none" stroke="currentColor" stroke-width="1.6" marker-end="url(#ah)"/><text x="510" y="28" font-size="11" text-anchor="middle" fill="currentColor" font-weight="600">Fe/Al</text><text x="510" y="180" font-size="11" text-anchor="middle" fill="currentColor">β = 2–2,5</text><text x="330" y="200" font-size="10" text-anchor="middle" fill="currentColor" fill-opacity="0.75">в аэротенк, возвратный ил или иловую смесь перед отстойником</text></svg>
