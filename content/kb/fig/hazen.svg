<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-label="Идеальный отстойник Хазена" font-family="Golos Text, system-ui, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs><rect x="80" y="40" width="460" height="150" fill="currentColor" fill-opacity=".07"/><path d="M80 40 V190 H540 V40" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M20 60 L78 60" fill="none" stroke="currentColor" stroke-width="1.6" marker-end="url(#ah)"/><text x="20" y="50" font-size="13" text-anchor="start" fill="currentColor" font-weight="600">Q</text><path d="M540 60 L620 60" fill="none" stroke="currentColor" stroke-width="1.6" marker-end="url(#ah)"/><text x="560" y="50" font-size="11" text-anchor="start" fill="currentColor">осветлённая</text><text x="310" y="30" font-size="11" text-anchor="middle" fill="currentColor" fill-opacity="0.8">длина L, площадь A = L·B</text><path d="M560 40 L560 190" fill="none" stroke="currentColor" stroke-width="1"/><text x="566" y="120" font-size="12" text-anchor="start" fill="currentColor">h₀</text><path d="M82 44 L538 186" fill="none" stroke="currentColor" stroke-width="2" marker-end="url(#ah)"/><text x="300" y="108" font-size="11" text-anchor="middle" fill="currentColor">u = u₀: оседает точно у конца</text><path d="M82 44 L330 186" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#ah)"/><text x="150" y="160" font-size="11" text-anchor="start" fill="currentColor">u &gt; u₀</text><path d="M82 44 L538 120" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#ah)"/><text x="470" y="98" font-size="11" text-anchor="end" fill="currentColor">u &lt; u₀</text><path d="M82 110 L538 186" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#ah)"/><text x="310" y="218" font-size="11.5" text-anchor="middle" fill="currentColor">Задерживаются все частицы с u ≥ u₀ = Q/A и доля u/u₀ более медленных</text><text x="310" y="240" font-size="10" text-anchor="middle" fill="currentColor" fill-opacity="0.7">Хазен (1904); вывод — MWH, разд. 10-5</text></svg>
