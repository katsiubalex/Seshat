<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" role="img" aria-label="Превращения азота на очистных" font-family="Golos Text, system-ui, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs><rect x="20" y="40" width="150" height="56" rx="6" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-width="1.6"/><text x="95.0" y="65.0" font-size="12" text-anchor="middle" fill="currentColor" font-weight="600">Органический N</text><text x="95.0" y="81.0" font-size="11" text-anchor="middle" fill="currentColor" fill-opacity="0.75">белки, мочевина</text><rect x="20" y="190" width="150" height="56" rx="6" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-width="1.6"/><text x="95.0" y="222.0" font-size="12" text-anchor="middle" fill="currentColor" font-weight="600">Аммоний NH₄⁺</text><rect x="280" y="190" width="130" height="56" rx="6" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-width="1.6"/><text x="345.0" y="222.0" font-size="12" text-anchor="middle" fill="currentColor" font-weight="600">Нитрит NO₂⁻</text><rect x="520" y="190" width="150" height="56" rx="6" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-width="1.6"/><text x="595.0" y="222.0" font-size="12" text-anchor="middle" fill="currentColor" font-weight="600">Нитрат NO₃⁻</text><rect x="400" y="30" width="140" height="56" rx="6" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-width="1.6"/><text x="470.0" y="55.0" font-size="12" text-anchor="middle" fill="currentColor" font-weight="600">Азот N₂</text><text x="470.0" y="71.0" font-size="11" text-anchor="middle" fill="currentColor" fill-opacity="0.75">в атмосферу</text><path d="M95 96 L95 188" fill="none" stroke="currentColor" stroke-width="1.6" marker-end="url(#ah)"/><text x="102" y="145" font-size="11" text-anchor="start" fill="currentColor">аммонификация</text><path d="M170 210 L278 210" fill="none" stroke="currentColor" stroke-width="1.6" marker-end="url(#ah)"/><text x="224" y="202" font-size="11" text-anchor="middle" fill="currentColor">+O₂</text><path d="M410 210 L518 210" fill="none" stroke="currentColor" stroke-width="1.6" marker-end="url(#ah)"/><text x="464" y="202" font-size="11" text-anchor="middle" fill="currentColor">+O₂</text><text x="345" y="270" font-size="11" text-anchor="middle" fill="currentColor">нитрификация: 4,57 г O₂ и 7,14 г CaCO₃ на 1 г N</text><path d="M595 190 L595 120 L540 75" fill="none" stroke="currentColor" stroke-width="1.8" marker-end="url(#ah)"/><text x="600" y="140" font-size="11" text-anchor="start" fill="currentColor">денитрификация</text><text x="600" y="155" font-size="10.5" text-anchor="start" fill="currentColor" fill-opacity="0.8">(органика, без O₂)</text><path d="M345 190 L440 88" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/><text x="372" y="130" font-size="11" text-anchor="end" fill="currentColor">анаммокс:</text><text x="372" y="145" font-size="11" text-anchor="end" fill="currentColor">NH₄⁺ + NO₂⁻ → N₂</text></svg>
